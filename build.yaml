# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: xiao_ble//zmk
    shield: corne_dongle prospector_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: corne_prospector_dongle
  
  - board: nice_nano//zmk
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_prospector_left 
  
  - board: nice_nano//zmk
    shield: corne_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_prospector_right 
  
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: nice_nano_settings_reset
  
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: xiao_ble_settings_reset
  
  - board: xiao_ble//zmk
    shield: revxlp rgbled_adapter
  
